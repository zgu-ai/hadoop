name: HDFS coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Build Hadoop (skip tests)
        run: mvn -DskipTests install

      # Run faster tests across the whole HDFS project with coverage
      - name: Run HDFS tests with coverage
        run: mvn -T 1C -pl hadoop-hdfs-project -Dtest=*Test* test


      - name: List possible jacoco outputs
        run: |
          ls -R | grep -i jacoco || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: hdfs-jacoco-report
          path: "hadoop-hdfs-project/**/target/site/jacoco/**"
