name: HDFS coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build Hadoop (skip tests)
        run: mvn -DskipTests install

      - name: Run HDFS tests with coverage
        run: mvn -pl hadoop-hdfs-project test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: hdfs-jacoco-report
          path: "**/target/site/jacoco/*.html"
