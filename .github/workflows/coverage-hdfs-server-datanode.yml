name: HDFS coverage

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Build Hadoop (skip tests)
        run: mvn -DskipTests install

      - name: Run DataNode tests with coverage
        run: mvn -pl hadoop-hdfs-project/hadoop-hdfs -Dtest="org/apache/hadoop/hdfs/server/datanode/**" test


      - name: List possible jacoco outputs
        run: |
          ls -R | grep -i jacoco || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-hdfs-server-datanode
          path: "hadoop-hdfs-project/**/target/site/jacoco/**"
